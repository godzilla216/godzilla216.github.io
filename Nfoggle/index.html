<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nfoggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="script.js" defer></script>
    <img id="headshot" src="emptyHeadshot.png">
    <img id="collegeTeam" src="questionMark.png" alt="Image">
    <img id="nflTeam" src="questionMark.png" alt="Image">
    <p id="playerText">Click start to begin!</p>
    <p id="hintCount">You have used 0 hints</p>
    <p id="score">Your score is 0</p>
    <button id="hint" onclick="showHint()">Start Game!</button>
    <input id="guess" type="text">
    <input id="submit" type="submit" onclick="guessPlayer()">
</body>
</html>
